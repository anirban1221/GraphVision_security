<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphVision Security</title>
  
  <!-- GraphVision Custom Logo Favicon -->
  <link rel="icon" type="image/png" href="/static/logo.png">

  <!-- Aesthetic Typography: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (Compiles JSX in browser) -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fallback loader for React & Babel in case unpkg is delayed or restricted -->
  <script>
    if (!window.React) {
      document.write('<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
    }
    if (!window.ReactDOM) {
      document.write('<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
    if (!window.Babel) {
      document.write('<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"><\/script>');
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          }

      }

  </script>

  <style>
    /* Soothing Ambient Color Shed (Gentle pastel aurora gradient wash) */
    body {
      background-color: #F8FAFC;
      background-image: 
        radial-gradient(at 0% 0%, rgba(224, 231, 255, 0.7) 0px, transparent 45%),
        radial-gradient(at 100% 0%, rgba(224, 242, 254, 0.55) 0px, transparent 40%),
        radial-gradient(at 50% 10%, rgba(238, 242, 255, 0.5) 0px, transparent 45%),
        radial-gradient(at 100% 50%, rgba(254, 242, 242, 0.35) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(240, 253, 250, 0.55) 0px, transparent 60%);
      background-attachment: fixed;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    /* Animated Brand Title (Shimmering metallic glow) */
    @keyframes gv-shimmer {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes gv-glow {
      0%, 100% {
        filter: drop-shadow(0 0 1px rgba(79, 70, 229, 0.15));
      }
      50% {
        filter: drop-shadow(0 0 7px rgba(99, 102, 241, 0.38));
      }
    }

    .gv-brand-title {
      background: linear-gradient(
        125deg,
        #0F172A 0%,
        #312E81 22%,
        #4F46E5 45%,
        #0284C7 68%,
        #0F172A 95%
      );
      background-size: 250% 250%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gv-shimmer 7s ease-in-out infinite, gv-glow 4s ease-in-out infinite;
      letter-spacing: -0.025em;
      display: inline-block;
      font-weight: 800;
      transition: filter 0.3s ease;
    }
    .gv-brand-title:hover {
      animation-duration: 3s, 2s;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    @keyframes gv-spin {
      to { transform: rotate(360deg); }
    }

    /* Distinct Ring Switcher Animations */
    @keyframes ring1-bloom {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      60% {
        transform: scale(1.015);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ring2-cascade {
      0% {
        opacity: 0;
        transform: translateY(-18px) scale(0.96);
      }
      60% {
        transform: translateY(4px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-ring1 {
      animation: ring1-bloom 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-ring2 {
      animation: ring2-cascade 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes pulse-banner {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    .attack-alert-pulse {
      animation: pulse-banner 1.2s infinite ease-in-out;
    }

    .target-highlight {
      outline: 2px solid #6366F1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      transition: all 0.3s ease;
    }
  </style>
</head>

  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Fixed Deterministic Geometry for Ring 1 (23 Users)
    const RING1_ANCHORS = [
      { id: "dev_smg9600", label: "Dev: Galaxy S9 Rooted", type: "device", color: "#9333EA", x: 230, y: 125 },
      { id: "dev_tor", label: "Dev: Tor Windows", type: "device", color: "#9333EA", x: 450, y: 125 },
      { id: "card_13844", label: "Shared Card #13844", type: "card", color: "#0284C7", x: 340, y: 170 },
      { id: "id20_507", label: "Shared ID20 #507", type: "id20", color: "#059669", x: 245, y: 215 },
      { id: "id20_344", label: "Shared ID20 #344", type: "id20", color: "#059669", x: 435, y: 215 }
    ];

    const RING1_ACTOR_POS = [
      // 8 Repeated Fraudsters (Lower arc, wide spacing, 100% fixed)
      { x: 135, y: 275 }, { x: 195, y: 285 }, { x: 255, y: 292 }, { x: 315, y: 296 },
      { x: 375, y: 296 }, { x: 435, y: 292 }, { x: 495, y: 285 }, { x: 555, y: 275 },
      // 15 Connected Mules (Upper horseshoe arc, wide spacing, 100% fixed)
      { x: 80,  y: 220 }, { x: 75,  y: 165 }, { x: 90,  y: 110 }, { x: 125, y: 65  },
      { x: 175, y: 40  }, { x: 235, y: 30  }, { x: 300, y: 25  }, { x: 370, y: 25  },
      { x: 435, y: 30  }, { x: 495, y: 40  }, { x: 545, y: 65  }, { x: 580, y: 110 },
      { x: 595, y: 165 }, { x: 590, y: 220 }, { x: 610, y: 270 }
    ];

    // Fixed Deterministic Geometry for Ring 2 (Emulator Device Hijack - 17 Users)
    const RING2_ANCHORS = [
      { id: "dev_pixel4", label: "Dev: Pixel 4 Emulator (Rooted)", type: "device", color: "#9333EA", x: 340, y: 115 },
      { id: "card_10486", label: "Shared Card #10486", type: "card", color: "#0284C7", x: 235, y: 180 },
      { id: "id20_507", label: "Shared ID20 #507", type: "id20", color: "#059669", x: 445, y: 180 }
    ];

    const RING2_ACTOR_POS = [
      // 5 Repeated Fraudsters in central pyramid below emulator
      { x: 265, y: 250 }, { x: 340, y: 255 }, { x: 415, y: 250 },
      { x: 300, y: 300 }, { x: 380, y: 300 },
      // 12 Connected Mules in lateral clusters
      { x: 95,  y: 90  }, { x: 120, y: 145 }, { x: 90,  y: 205 }, { x: 130, y: 265 },
      { x: 180, y: 295 }, { x: 170, y: 80  }, { x: 505, y: 80  }, { x: 545, y: 90  },
      { x: 520, y: 145 }, { x: 550, y: 205 }, { x: 510, y: 265 }, { x: 460, y: 295 }
    ];

    // Stacked Risk Data (Exact match for Reference Pic 2)
    const HISTORICAL_RISK_DATA = [
      { date: "Dec 21", highPct: 66.7, medPct: 33.3, highCount: 16, medCount: 8, total: 24 },
      { date: "Dec 22", highPct: 83.3, medPct: 16.7, highCount: 20, medCount: 4, total: 24 },
      { date: "Dec 23", highPct: 100.0, medPct: 0.0, highCount: 28, medCount: 0, total: 28 },
      { date: "Dec 25", highPct: 0.0, medPct: 100.0, highCount: 0, medCount: 22, total: 22 },
      { date: "Dec 28", highPct: 0.0, medPct: 100.0, highCount: 0, medCount: 19, total: 19 },
      { date: "Dec 29", highPct: 33.3, medPct: 66.7, highCount: 9, medCount: 18, total: 27 },
      { date: "Dec 30", highPct: 0.0, medPct: 100.0, highCount: 0, medCount: 25, total: 25 }
    ];

    function App() {
      const [wsConnected, setWsConnected] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);

      // KPI Stats
      const [kpi, setKpi] = useState({
        total_streamed: 40,
        fraud_pct: 3.42,
        current_date: "Dec 22"
      });

      // Feeds
      const [transactions, setTransactions] = useState([]);
      const [tickerPoints, setTickerPoints] = useState([]);

      // Time Travel / History Scrubber State (< and > buttons)
      const [historyOffset, setHistoryOffset] = useState(0); // 0 = Live Feed; > 0 = points back in time

      // Ring State Management (FIXED: selectedRingId prevents Ring 2 reverting to Ring 1)
      const [activeRings, setActiveRings] = useState([]);
      const [selectedRingId, setSelectedRingId] = useState('Ring 1');
      const [selectedActor, setSelectedActor] = useState(null);
      const [showRingSelector, setShowRingSelector] = useState(false); // Collapsed by default
      const [isNetworkModalOpen, setIsNetworkModalOpen] = useState(false); // Pop-out modal

      // Attack Banner visibility: ONLY visible when user clicks red peak dot
      const [showAttackBanner, setShowAttackBanner] = useState(false);
      const [bannerDismissed, setBannerDismissed] = useState(false);

      // Subnav Active Tab
      const [activeNavTab, setActiveNavTab] = useState('Overview');
      const [transactionFilter, setTransactionFilter] = useState('ALL');

      // Hovered Bar Tooltip State for Pic 2 Stacked Chart
      const [hoveredBar, setHoveredBar] = useState(null);

      // Blocked Actors Set (Diagnostic Mode)
      const [blockedActors, setBlockedActors] = useState(new Set());
      const [actionToast, setActionToast] = useState(null);

      const wsRef = useRef(null);
      const tickerCanvasRef = useRef(null);
      const redDotsRef = useRef([]);

      // Derive selected ring safely
      const selectedRing = useMemo(() => {
        if (!activeRings || activeRings.length === 0) return null;
        return activeRings.find(r => r.ring_id === selectedRingId) || activeRings[0];
      }, [activeRings, selectedRingId]);

      // 1. WebSocket Connection & Immediate Timeline Pre-Seed
      useEffect(() => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/stream`;
        const ws = new WebSocket(wsUrl);
        wsRef.current = ws;

        ws.onopen = () => {
          setWsConnected(true);
          console.log("[WebSocket] Connected to GraphVision Security Stream.");
        };

        ws.onclose = () => setWsConnected(false);

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === 'INIT_STATE') {
            if (msg.active_rings && msg.active_rings.length > 0) {
              setActiveRings(msg.active_rings);
            }
            if (msg.stats) {
              setKpi(prev => ({
                ...prev,
                total_streamed: msg.stats.total_processed || 40,
                fraud_pct: 3.42
              }));
            }
            // Pre-populate tickerPoints with server pre-seeded timeline points!
            if (msg.timeline && msg.timeline.length > 0) {
              const pts = msg.timeline.map((pt, idx) => {
                const dayOffset = Math.floor((pt.timestamp || 0) / 86400);
                const simDay = 21 + (dayOffset % 10);
                const isSpike = pt.is_spike || pt.risk_score >= 0.70;
                return {
                  date: `Dec ${simDay}`,
                  dt: pt.timestamp,
                  val: pt.risk_score,
                  is_spike: isSpike,
                  tx_id: pt.tx_id,
                  card1: isSpike ? (idx % 2 === 0 ? 13844 : 10486) : 9500
                };
              });
              setTickerPoints(pts);
            }
          } else if (msg.type === 'TRANSACTION_EVENT') {
            const tx = msg.transaction;
            const stats = msg.stats;
            const analytics = msg.analytics;

            if (msg.active_rings && msg.active_rings.length > 0) {
              setActiveRings(msg.active_rings);
            }

            const dayOffset = Math.floor((tx.TransactionDT || 0) / 86400);
            const simDay = 21 + (dayOffset % 10);
            const currentDateStr = `Dec ${simDay}`;

            if (stats) {
              setKpi({
                total_streamed: stats.total_processed,
                fraud_pct: analytics?.fraud_rate || 3.42,
                current_date: currentDateStr
              });
            }

            // Append transaction to live feed (keep 35)
            setTransactions(prev => [tx, ...prev.slice(0, 34)]);

            // Append to ticker history (keep up to 300 points for rich historical scrubbing)
            const isSpike = tx.velocity?.is_spike || tx.risk_score >= 0.70;
            setTickerPoints(prev => [
              ...prev.slice(-250),
              {
                date: currentDateStr,
                dt: tx.TransactionDT,
                val: tx.risk_score,
                is_spike: isSpike,
                tx_id: tx.TransactionID,
                card1: tx.card1
              }
            ]);
          } else if (msg.type === 'RESET_STATE') {
            setTransactions([]);
            setTickerPoints([]);
            setHistoryOffset(0);
            setShowAttackBanner(false);
            setSelectedActor(null);
          }
        };

        return () => ws.close();
      }, []);

      // Visible Window of Points (Supports Time Travel Scrubber)
      const WINDOW_SIZE = 55;
      const isLive = historyOffset === 0;

      const visiblePoints = useMemo(() => {
        if (tickerPoints.length <= WINDOW_SIZE) return tickerPoints;
        const end = tickerPoints.length - historyOffset;
        const start = Math.max(0, end - WINDOW_SIZE);
        return tickerPoints.slice(start, Math.max(start + 1, end));
      }, [tickerPoints, historyOffset]);

      // 2. Animated Canvas Rendering Loop with Blinking/Pulsing Red Spikes (NO TEXT CALLOUT TAGS)
      useEffect(() => {
        let animId;

        const drawCanvas = () => {
          const canvas = tickerCanvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          const width = canvas.width;
          const height = canvas.height;

          ctx.clearRect(0, 0, width, height);

          const marginLeft = 65;
          const marginRight = 24;
          const marginTop = 30;
          const marginBottom = 42;
          const chartWidth = width - marginLeft - marginRight;
          const chartHeight = height - marginTop - marginBottom;

          // Subtle Gridlines & Y-Axis Labels
          const yTicks = [
            { val: 1.0, label: "100%" },
            { val: 0.75, label: "75%" },
            { val: 0.50, label: "50%" },
            { val: 0.25, label: "25%" },
            { val: 0.0, label: "0%" }
          ];

          yTicks.forEach(tick => {
            const y = marginTop + (1.0 - tick.val) * chartHeight;

            ctx.beginPath();
            ctx.strokeStyle = tick.val === 0.0 ? '#CBD5E1' : '#F1F5F9';
            ctx.lineWidth = tick.val === 0.0 ? 1.5 : 1;
            ctx.setLineDash(tick.val === 0.0 ? [] : [4, 4]);
            ctx.moveTo(marginLeft, y);
            ctx.lineTo(width - marginRight, y);
            ctx.stroke();

            ctx.fillStyle = '#64748B';
            ctx.font = '600 11px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(tick.label, marginLeft - 10, y + 4);
          });
          ctx.setLineDash([]);

          // X-Axis Baseline
          ctx.beginPath();
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 1.5;
          ctx.moveTo(marginLeft, marginTop + chartHeight);
          ctx.lineTo(width - marginRight, marginTop + chartHeight);
          ctx.stroke();

          // Calendar Dates along X-Axis
          const dateTicks = ["Dec 21", "Dec 22", "Dec 23", "Dec 24", "Dec 25", "Dec 26", "Dec 27", "Dec 28", "Dec 29", "Dec 30"];
          dateTicks.forEach((dt, idx) => {
            const x = marginLeft + (idx / (dateTicks.length - 1)) * chartWidth;

            ctx.beginPath();
            ctx.strokeStyle = '#94A3B8';
            ctx.lineWidth = 1;
            ctx.moveTo(x, marginTop + chartHeight);
            ctx.lineTo(x, marginTop + chartHeight + 5);
            ctx.stroke();

            ctx.fillStyle = '#64748B';
            ctx.font = '500 11px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(dt, x, marginTop + chartHeight + 20);
          });

          if (visiblePoints.length < 2) {
            ctx.fillStyle = '#94A3B8';
            ctx.font = '500 13px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Initializing live telemetry stream...", width / 2, height / 2);
            return;
          }

          const stepX = chartWidth / Math.max(20, visiblePoints.length - 1);

          // Area Gradient Fill
          ctx.beginPath();
          visiblePoints.forEach((pt, i) => {
            const x = marginLeft + i * stepX;
            const y = marginTop + (1.0 - Math.min(1.0, Math.max(0, pt.val))) * chartHeight;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.lineTo(marginLeft + (visiblePoints.length - 1) * stepX, marginTop + chartHeight);
          ctx.lineTo(marginLeft, marginTop + chartHeight);
          ctx.closePath();

          const grad = ctx.createLinearGradient(0, marginTop, 0, marginTop + chartHeight);
          grad.addColorStop(0, 'rgba(22, 163, 74, 0.28)');
          grad.addColorStop(0.7, 'rgba(22, 163, 74, 0.06)');
          grad.addColorStop(1, 'rgba(22, 163, 74, 0.0)');
          ctx.fillStyle = grad;
          ctx.fill();

          // Main Trendline
          ctx.beginPath();
          ctx.strokeStyle = '#16A34A';
          ctx.lineWidth = 2.5;
          visiblePoints.forEach((pt, i) => {
            const x = marginLeft + i * stepX;
            const y = marginTop + (1.0 - Math.min(1.0, Math.max(0, pt.val))) * chartHeight;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();

          // BLINKING / PULSING RED SPIKE DETECTORS (NO FLOATING TEXT TAGS)
          const now = Date.now();
          const pulsePhase = (now % 1000) / 1000; // 0 to 1
          const pulseRadius = 7 + pulsePhase * 12;
          const pulseAlpha = 0.7 * (1.0 - pulsePhase);

          const redDots = [];
          visiblePoints.forEach((pt, i) => {
            if (pt.is_spike || pt.val >= 0.70) {
              const x = marginLeft + i * stepX;
              const y = marginTop + (1.0 - Math.min(1.0, Math.max(0, pt.val))) * chartHeight;

              // Outer expanding blinking halo
              ctx.beginPath();
              ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(220, 38, 38, ${pulseAlpha})`;
              ctx.fill();

              // Secondary glow ring
              ctx.beginPath();
              ctx.arc(x, y, 10, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(220, 38, 38, 0.35)';
              ctx.fill();

              // Inner solid red dot
              ctx.beginPath();
              ctx.arc(x, y, 6.5, 0, Math.PI * 2);
              ctx.fillStyle = '#DC2626';
              ctx.fill();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2.5;
              ctx.stroke();

              redDots.push({ x, y, pt, ringIndex: i % 2 });
            }
          });
          redDotsRef.current = redDots;
        };

        const loop = () => {
          drawCanvas();
          animId = requestAnimationFrame(loop);
        };
        animId = requestAnimationFrame(loop);

        return () => cancelAnimationFrame(animId);
      }, [visiblePoints]);

      // 3. Handle Canvas Clicks on Red Peak Dots
      const handleCanvasClick = (e) => {
        const canvas = tickerCanvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        let hit = null;
        let minDist = 30;
        redDotsRef.current.forEach(dot => {
          const dist = Math.hypot(dot.x - clickX, dot.y - clickY);
          if (dist < minDist) {
            minDist = dist;
            hit = dot;
          }
        });

        if (hit) {
          const targetRingId = hit.ringIndex === 0 ? 'Ring 1' : 'Ring 2';
          setSelectedRingId(targetRingId);
          setShowAttackBanner(true);
          setBannerDismissed(false);
          setActionToast(`Focused on Attack Spike (Card #${hit.pt.card1}) • Switched to ${targetRingId}`);
          setTimeout(() => setActionToast(null), 3500);

          const el = document.getElementById('attack-intelligence');
          if (el) {
            el.scrollIntoView({ behavior: 'smooth' });
            el.classList.add('target-highlight');
            setTimeout(() => el.classList.remove('target-highlight'), 1800);
          }
        }

        const canvas = tickerCanvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        const isNear = redDotsRef.current.some(dot => Math.hypot(dot.x - mouseX, dot.y - mouseY) < 25);
        canvas.style.cursor = isNear ? 'pointer' : 'default';
      };

      const goBackInTime = () => {
        // Pause live broadcast so timeline is static and easy to click

          setIsPlaying(false);
          wsRef.current?.send(JSON.stringify({ command: "pause" }));

        const maxOffset = Math.max(0, tickerPoints.length - 20);
        setHistoryOffset(prev => Math.min(maxOffset, prev + 10));
        setActionToast("⏸ Timeline static in Past mode — select any red spike easily");
        setTimeout(() => setActionToast(null), 3000);
      };

      const goForwardInTime = () => {
        setHistoryOffset(prev => {
          const nextOffset = Math.max(0, prev - 10);
          if (nextOffset === 0) {
            // Reached present (live feed): unpause and resume stream at usual speed!
            setIsPlaying(true);
            wsRef.current?.send(JSON.stringify({ command: "play" }));
            setActionToast("Returned to Present (Live Feed) — Stream Resumed");
            setTimeout(() => setActionToast(null), 2500);
          } else {
            setActionToast(`Stepped forward in time (${nextOffset} pts behind)`);
            setTimeout(() => setActionToast(null), 2000);

          return nextOffset;

        if (isPlaying) {
          setIsPlaying(false);
          wsRef.current?.send(JSON.stringify({ command: "pause" }));

        let targetIdx = -1;

                {/* Modal Body with Large High-Resolution Canvas */}
                <div className="p-6 overflow-auto flex-1 bg-gradient-to-b from-slate-50/50 via-white to-slate-50/30 flex flex-col items-center">
                  <div className="w-full bg-white rounded-xl border border-slate-200 p-4 shadow-sm relative overflow-hidden">
                    <svg viewBox="0 0 720 360" className="w-full h-[420px]">
                      {/* Connection Lines */}
                      {selectedRing.network.edges.map((edge, idx) => {
                        const aIdx = selectedRing.actors.findIndex(a => a.actor_id === edge.source);
                        const ancList = selectedRing.ring_id === 'Ring 1' ? RING1_ANCHORS : RING2_ANCHORS;
                        const posList = selectedRing.ring_id === 'Ring 1' ? RING1_ACTOR_POS : RING2_ACTOR_POS;
                        const anc = ancList.find(a => a.id === edge.target);
                        const actorPos = posList[aIdx] || { x: 360, y: 180 };
                        if (!anc) return null;
                        const isFraudster = aIdx < selectedRing.community.known_fraudsters;

                        return (
                          <line
                            key={idx}
                            x1={actorPos.x}
                            y1={actorPos.y}
                            x2={anc.x}
                            y2={anc.y}
                            stroke={isFraudster ? '#EF4444' : '#94A3B8'}
                            strokeWidth={isFraudster ? 2.5 : 1.2}
                            strokeDasharray={isFraudster ? "none" : "3,3"}
                            opacity={isFraudster ? 0.9 : 0.6}
                          />
                        );
                      })}

                      {/* Central Shared Hardware & Card Anchors */}
                      {(selectedRing.ring_id === 'Ring 1' ? RING1_ANCHORS : RING2_ANCHORS).map((anc) => (
                        <g key={anc.id} transform={`translate(${anc.x}, ${anc.y})`}>
                          <rect 
                            x="-62" y="-14" width="124" height="28" rx="14" 
                            fill={anc.color} 
                            opacity="0.95" 
                            className="shadow-sm"
                          />
                          <text 
                            textAnchor="middle" y="4.5" 
                            fill="#FFFFFF" 
                            fontSize="10" 
                            fontWeight="700"
                            fontFamily="Inter, sans-serif"
                          >
                            {anc.label}
                          </text>
                        </g>
                      ))}

                      {/* Orbiting Actor Nodes */}
                      {selectedRing.actors.map((actor, idx) => {
                        const posList = selectedRing.ring_id === 'Ring 1' ? RING1_ACTOR_POS : RING2_ACTOR_POS;
                        const pos = posList[idx] || { x: 360, y: 180 };
                        const isFraud = actor.is_repeated_fraudster;
                        const isSelected = selectedActor?.actor_id === actor.actor_id;

                        return (
                          <g 
                            key={actor.actor_id} 
                            transform={`translate(${pos.x}, ${pos.y})`}
                            onClick={() => setSelectedActor(actor)}
                            className="cursor-pointer"
                          >
                            {isFraud && (
                              <circle cx="0" cy="0" r="18" fill="#DC2626" opacity="0.3" className="animate-pulse" />
                            )}
                            <circle 
                              cx="0" cy="0"
                              r={isFraud ? 12 : 9} 
                              fill={isFraud ? '#DC2626' : '#6366F1'} 
                              stroke={isSelected ? '#FBBF24' : '#FFFFFF'} 
                              strokeWidth={isSelected ? 4 : 2.5}
                            />
                            {isFraud && (
                              <text textAnchor="middle" y="4" fill="#FFFFFF" fontSize="9" fontWeight="900">
                                !
                              </text>
                            )}
                            <text 
                              textAnchor="middle" 
                              y={isFraud ? 22 : 19} 
                              fill={isFraud ? '#DC2626' : '#475569'} 
                              fontSize="9.5" 
                              fontWeight="700"
                              fontFamily="Inter, sans-serif"
                            >
                              {actor.actor_id}
                            </text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>

                  {/* Selected Actor Details Strip inside Modal */}
                  {selectedActor && (
                    <div className="w-full mt-4 p-4 bg-indigo-50/90 border border-indigo-200 rounded-xl flex items-center justify-between text-xs animate-fadeIn shadow-xs">
                      <div className="flex items-center gap-5">
                        <div>
                          <span className="text-[10px] text-slate-400 block font-medium">Selected Actor:</span>
                          <span className="font-bold text-sm text-indigo-950 font-mono">{selectedActor.actor_id}</span>
                        </div>
                        <div className={`px-2.5 py-1 rounded-md font-bold ${selectedActor.is_repeated_fraudster ? 'bg-red-100 text-red-700' : 'bg-indigo-100 text-indigo-700'}`}>
                          {selectedActor.is_repeated_fraudster ? '⚠️ Repeated Fraudster' : 'Connected Mule'}
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-medium">Primary Card:</span>
                          <span className="font-semibold text-slate-800">#{selectedActor.card1}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-medium">GNN Risk:</span>
                          <span className="font-bold text-red-600">{(selectedActor.risk_score * 100).toFixed(0)}%</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block font-medium">Fraud Chain History:</span>
                          <span className="font-bold text-slate-800">{selectedActor.fraud_chain_count} times</span>
                        </div>
                      </div>

                      <button
                        onClick={() => handleBlockActor(selectedActor.actor_id)}
                        className={`px-3.5 py-1.5 rounded-lg font-semibold text-xs shadow-xs transition flex items-center gap-1.5 ${
                          blockedActors.has(selectedActor.actor_id)
                            ? 'bg-slate-800 text-white'
                            : 'bg-red-600 text-white hover:bg-red-700'
                        }`}
                      >
                        <span>🛑</span>
                        <span>{blockedActors.has(selectedActor.actor_id) ? 'Unblock Actor' : 'Block Actor'}</span>
                      </button>
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
